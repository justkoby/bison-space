<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bison’s Space — Portrait, Beauty & Fashion Photography in Accra</title>
    <meta
      name="description"
      content="Bison’s Space is the studio of Lazarus Nukunu in Adenta, Accra — portrait, beauty, fashion and editorial photography with presence."
    />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <meta name="theme-color" content="#0b0a08" />
    <script>
      // Apply the stored theme before first paint (no flash of the wrong theme).
      (function () {
        try {
          if (localStorage.getItem('bisons-theme') === 'light') {
            var root = document.documentElement;
            root.dataset.theme = 'light';
            root.style.colorScheme = 'light';
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#f4ede2');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
